<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartão da Guilda — Escolha a Mesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:28px;
    padding:32px 16px;
    background:radial-gradient(circle at 50% 20%, #1b1712 0%, #0a0806 70%, #000 100%);
    font-family:'Cinzel',serif;
  }
  .page-title{
    color:#e0b656;
    font-size:26px;
    font-weight:700;
    letter-spacing:.03em;
    text-align:center;
    text-shadow:0 0 18px rgba(224,182,86,.35);
    margin:0;
  }
  .page-sub{
    color:#a89a7c;
    font-size:13.5px;
    text-align:center;
    margin:-16px 0 6px;
    max-width:420px;
  }
  .choices{
    display:flex;flex-wrap:wrap;gap:26px;justify-content:center;align-items:stretch;
  }
  .campaign-card{
    width:260px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:30px 20px;
    border-radius:10px;
    text-decoration:none;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .campaign-card:hover, .campaign-card:focus-visible{
    transform:translateY(-4px);
  }
  .campaign-card .logo-img{
    width:100%;
    max-width:210px;
    height:auto;
    display:block;
  }
  .campaign-card .desc{font-size:11.5px;font-weight:400;text-align:center;opacity:.8;}

  /* Petricor: Beijo Grego — a logo é bem clara/pergaminho, feita pra ficar sobre fundo escuro
     (mesmo esquema da tela de login original), então o card aqui também é escuro, só com um
     leve calor dourado no lugar do verde neon do 40K. */
  .card-bg{
    background:radial-gradient(ellipse at 50% 30%, #2a2013, #140f09 75%);
    border:1px solid #8a661f;
    box-shadow:0 4px 14px rgba(0,0,0,.5);
  }
  .card-bg:hover, .card-bg:focus-visible{
    border-color:#e0b656;
    box-shadow:0 8px 26px rgba(224,182,86,.4);
  }
  .card-bg .desc{color:#c9b98a;}

  /* Rogue Trader — ferro escuro, dourado imperial e vermelho de selo de cera. */
  .card-rt{
    background:radial-gradient(ellipse at 50% 25%, #3a0d10, #12090a 72%);
    border:1px solid #7a5a24;
    box-shadow:0 4px 14px rgba(0,0,0,.5);
  }
  .card-rt:hover, .card-rt:focus-visible{
    border-color:#d4ac5a;
    box-shadow:0 8px 26px rgba(179,38,43,.45);
  }
  .card-rt .desc{color:#d9c49a;}
  .card-rt .rt-logo-img{max-width:230px;border-radius:6px;box-shadow:0 0 0 1px rgba(212,172,90,.35), 0 6px 18px rgba(0,0,0,.6);}
  .card-rt:hover .rt-logo-img, .card-rt:focus-visible .rt-logo-img{box-shadow:0 0 0 1px #d4ac5a, 0 0 22px rgba(179,38,43,.55);}
  .rt-logo{display:flex;flex-direction:column;align-items:center;gap:4px;color:#d4ac5a;text-align:center;
    text-shadow:0 0 14px rgba(212,172,90,.4), 0 2px 0 #000;}
  .rt-logo-orn{font-size:15px;letter-spacing:.55em;color:#b3262b;}
  .rt-logo-sub{font-size:10px;letter-spacing:.42em;color:#c9a0a0;}
  .rt-logo-title{font-size:30px;font-weight:700;letter-spacing:.05em;line-height:1.05;}

  .page-footer{
    color:#6b6250;
    font-size:11px;
    text-align:center;
    margin-top:4px;
  }
</style>
</head>
