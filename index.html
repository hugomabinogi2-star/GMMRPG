<head>

<style>
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:28px;
    padding:32px 16px;
    background:radial-gradient(circle at 50% 20%, #1b1712 0%, #0a0806 70%, #000 100%);
    font-family:'Cinzel',serif;
  }
  .page-title{
    color:#e0b656;
    font-size:26px;
    font-weight:700;
    letter-spacing:.03em;
    text-align:center;
    text-shadow:0 0 18px rgba(224,182,86,.35);
    margin:0;
  }
  .page-sub{
    color:#a89a7c;
    font-size:13.5px;
    text-align:center;
    margin:-16px 0 6px;
    max-width:420px;
  }
  .choices{
    display:flex;flex-wrap:wrap;gap:26px;justify-content:center;align-items:stretch;
  }
  .campaign-card{
    width:260px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:30px 20px;
    border-radius:10px;
    text-decoration:none;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .campaign-card:hover, .campaign-card:focus-visible{
    transform:translateY(-4px);
  }
  .campaign-card .logo-img{
    width:100%;
    max-width:210px;
    height:auto;
    display:block;
  }
  .campaign-card .desc{font-size:11.5px;font-weight:400;text-align:center;opacity:.8;}

  /* Petricor: Beijo Grego — a logo é bem clara/pergaminho, feita pra ficar sobre fundo escuro
     (mesmo esquema da tela de login original), então o card aqui também é escuro, só com um
     leve calor dourado no lugar do verde neon do 40K. */
  .card-bg{
    background:radial-gradient(ellipse at 50% 30%, #2a2013, #140f09 75%);
    border:1px solid #8a661f;
    box-shadow:0 4px 14px rgba(0,0,0,.5);
  }
  .card-bg:hover, .card-bg:focus-visible{
    border-color:#e0b656;
    box-shadow:0 8px 26px rgba(224,182,86,.4);
  }
  .card-bg .desc{color:#c9b98a;}

  /* Mag Mell — dourado sobre esmeralda escura, igual à logo (pergaminho/altar antigo, sem o
     verde neon de terminal que a campanha tinha antes de virar Mag Mell). */
  .card-magmell{
    background:radial-gradient(ellipse at 50% 30%, #0d2418, #030a06 75%);
    border:1px solid #8a6a3a;
    box-shadow:0 4px 14px rgba(0,0,0,.5);
  }
  .card-magmell:hover, .card-magmell:focus-visible{
    border-color:#e3c58c;
    box-shadow:0 8px 26px rgba(69,184,196,.4);
  }
  .card-magmell .desc{color:#bfe8df;}

  .page-footer{
    color:#6b6250;
    font-size:11px;
    text-align:center;
    margin-top:4px;
  }
</style>
</head>
