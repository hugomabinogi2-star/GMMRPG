<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartão da Guilda — Escolha a Mesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:28px;
    padding:32px 16px;
    background:radial-gradient(circle at 50% 20%, #1b1712 0%, #0a0806 70%, #000 100%);
    font-family:'Cinzel',serif;
  }
  .page-title{
    color:#e0b656;
    font-size:26px;
    font-weight:700;
    letter-spacing:.03em;
    text-align:center;
    text-shadow:0 0 18px rgba(224,182,86,.35);
    margin:0;
  }
  .page-sub{
    color:#a89a7c;
    font-size:13.5px;
    text-align:center;
    margin:-16px 0 6px;
    max-width:420px;
  }
  .choices{
    display:flex;flex-wrap:wrap;gap:26px;justify-content:center;align-items:stretch;
  }
  .campaign-card{
    width:250px;
    display:flex;flex-direction:column;align-items:center;gap:12px;
    padding:28px 22px;
    border-radius:10px;
    text-decoration:none;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .campaign-card:hover, .campaign-card:focus-visible{
    transform:translateY(-4px);
  }
  .campaign-card .icon{font-size:44px;line-height:1;}
  .campaign-card .name{font-size:17px;font-weight:600;letter-spacing:.02em;}
  .campaign-card .desc{font-size:11.5px;font-weight:400;text-align:center;opacity:.8;}

  /* Petricor: Beijo Grego — pergaminho/ouro */
  .card-bg{
    background:linear-gradient(180deg,#eee2c8,#d8c39a);
    border:1px solid #ab9268;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
    color:#332c1e;
  }
  .card-bg:hover, .card-bg:focus-visible{
    border-color:#e0b656;
    box-shadow:0 8px 24px rgba(224,182,86,.35);
  }
  .card-bg .name{color:#5f4b1e;}
  .card-bg .desc{color:#5f5540;}

  /* Warhammer 40K — preto/verde neon */
  .card-40k{
    background:#020d06;
    border:1px solid #1a8a4e;
    box-shadow:0 4px 14px rgba(0,0,0,.5);
    color:#8fd9ab;
    font-family:'Orbitron',sans-serif;
  }
  .card-40k:hover, .card-40k:focus-visible{
    border-color:#39ff88;
    box-shadow:0 8px 26px rgba(57,255,136,.45);
  }
  .card-40k .name{color:#39ff88;font-weight:800;letter-spacing:.04em;}
  .card-40k .desc{color:#8fd9ab;font-family:'Share Tech Mono',monospace;}

  .page-footer{
    color:#6b6250;
    font-size:11px;
    text-align:center;
    margin-top:4px;
  }
</style>
</head>
<body>

  <h1 class="page-title">🗡️ Cartão da Guilda 🗡️</h1>
  <p class="page-sub">Escolha a mesa / campanha que você quer acessar.</p>

  <div class="choices">
    <a class="campaign-card card-bg" href="index_BG.html">
      <span class="icon">⚱️</span>
      <span class="name">Petricor: Beijo Grego</span>
      <span class="desc">Ficha de personagem &amp; mesa</span>
    </a>
    <a class="campaign-card card-40k" href="index_40K.html">
      <span class="icon">☠️</span>
      <span class="name">Warhammer 40K</span>
      <span class="desc">Ficha de personagem &amp; mesa</span>
    </a>
  </div>

  <p class="page-footer">Petricor: Beijo Grego · Warhammer 40K</p>

</body>
</html>
